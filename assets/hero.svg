<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Perspective interior study</title>
  <desc id="desc">A dark architectural one-point perspective: a wireframe room, a cold horizon opening, a light pool on a grid floor, and drifting dust.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#04060A"/>
      <stop offset="0.5" stop-color="#070C12"/>
      <stop offset="1" stop-color="#0A1118"/>
    </linearGradient>

    <radialGradient id="glowCool" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#4C7FD1" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#2E5A9E" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2E5A9E" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowWarm" cx="0.13" cy="0.85" r="0.36">
      <stop offset="0" stop-color="#D9A26B" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#D9A26B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="windowGlow" cx="0.5" cy="0.6" r="0.62">
      <stop offset="0" stop-color="#DCEEFF" stop-opacity="0.62"/>
      <stop offset="0.4" stop-color="#7FA8E8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#3B5F96" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="windowFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6E8FF" stop-opacity="0.34"/>
      <stop offset="0.72" stop-color="#8FB4E8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#5C88C8" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FB4E8" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#D2E5FA" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#8FB4E8" stop-opacity="0.06"/>
    </linearGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE2FF" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#9FC2EC" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#6E94C6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="floorFade" gradientUnits="userSpaceOnUse" x1="0" y1="296" x2="0" y2="420">
      <stop offset="0" stop-color="#BBD4F2" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#9FC2EC" stop-opacity="0.10"/>
    </linearGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.52" r="0.76">
      <stop offset="0.4" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.66"/>
    </radialGradient>

    <filter id="blurSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <filter id="blurTight" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="floorClip">
      <polygon points="470,300 730,300 1080,420 120,420"/>
    </clipPath>
  </defs>

  <!-- base -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glowCool)"/>
  <rect width="1200" height="420" fill="url(#glowWarm)"/>

  <!-- drifting dust -->
  <g fill="#D7E6FA">
    <circle cx="214" cy="96" r="1.5" opacity="0.42"/>
    <circle cx="318" cy="58" r="1.0" opacity="0.26"/>
    <circle cx="402" cy="122" r="0.9" opacity="0.20"/>
    <circle cx="512" cy="74" r="1.2" opacity="0.30"/>
    <circle cx="628" cy="52" r="0.8" opacity="0.20"/>
    <circle cx="742" cy="96" r="1.3" opacity="0.34"/>
    <circle cx="836" cy="64" r="0.9" opacity="0.18"/>
    <circle cx="938" cy="110" r="1.1" opacity="0.26"/>
    <circle cx="1042" cy="76" r="1.6" opacity="0.30"/>
    <circle cx="1104" cy="152" r="0.9" opacity="0.16"/>
    <circle cx="132" cy="188" r="1.0" opacity="0.16"/>
    <circle cx="86" cy="112" r="1.2" opacity="0.22"/>
    <circle cx="574" cy="196" r="1.1" opacity="0.34"/>
    <circle cx="646" cy="214" r="0.9" opacity="0.26"/>
  </g>

  <!-- ambient bloom behind the back wall -->
  <ellipse cx="600" cy="246" rx="310" ry="172" fill="url(#glowCool)" filter="url(#blurSoft)" opacity="0.6"/>

  <!-- side walls -->
  <g stroke="#8FB4E8" fill="none" stroke-linecap="square">
    <line x1="470" y1="140" x2="150" y2="20" stroke-opacity="0.30" stroke-width="1"/>
    <line x1="730" y1="140" x2="1050" y2="20" stroke-opacity="0.30" stroke-width="1"/>
    <line x1="470" y1="300" x2="150" y2="420" stroke-opacity="0.32" stroke-width="1"/>
    <line x1="730" y1="300" x2="1050" y2="420" stroke-opacity="0.32" stroke-width="1"/>
    <line x1="150" y1="20" x2="150" y2="420" stroke-opacity="0.16" stroke-width="1"/>
    <line x1="1050" y1="20" x2="1050" y2="420" stroke-opacity="0.16" stroke-width="1"/>
  </g>

  <!-- back wall -->
  <rect x="470" y="140" width="260" height="160" fill="#0A111A" opacity="0.62"/>
  <rect x="470" y="140" width="260" height="160" fill="none" stroke="#9FC2EC" stroke-opacity="0.40" stroke-width="1"/>

  <!-- opening: horizon light -->
  <g>
    <ellipse cx="600" cy="250" rx="130" ry="100" fill="url(#windowGlow)" filter="url(#blurTight)" opacity="0.9"/>
    <rect x="532" y="176" width="136" height="112" fill="url(#windowFill)" stroke="#DCEBFF" stroke-opacity="0.34" stroke-width="0.9"/>
    <line x1="532" y1="232" x2="668" y2="232" stroke="#EAF3FF" stroke-opacity="0.26" stroke-width="0.9"/>
    <line x1="600" y1="176" x2="600" y2="288" stroke="#D3E4FA" stroke-opacity="0.14" stroke-width="0.8"/>
    <line x1="470" y1="300" x2="730" y2="300" stroke="url(#edgeGrad)" stroke-width="1.3"/>
  </g>

  <!-- light pool cast on the floor -->
  <g clip-path="url(#floorClip)">
    <polygon points="536,290 664,290 830,420 370,420" fill="url(#beam)" filter="url(#blurTight)"/>
    <ellipse cx="600" cy="404" rx="180" ry="26" fill="#BFD8FF" opacity="0.10" filter="url(#blurSoft)"/>
  </g>

  <!-- perspective cage: ceiling -->
  <g stroke="#8FB4E8" stroke-opacity="0.24" stroke-width="0.9" fill="none">
    <line x1="390" y1="110" x2="810" y2="110"/>
    <line x1="310" y1="80" x2="890" y2="80"/>
    <line x1="230" y1="50" x2="970" y2="50"/>
    <line x1="390" y1="110" x2="390" y2="330"/>
    <line x1="310" y1="80" x2="310" y2="360"/>
    <line x1="230" y1="50" x2="230" y2="390"/>
    <line x1="810" y1="110" x2="810" y2="330"/>
    <line x1="890" y1="80" x2="890" y2="360"/>
    <line x1="970" y1="50" x2="970" y2="390"/>
  </g>

  <!-- perspective cage: floor -->
  <g clip-path="url(#floorClip)" stroke="url(#floorFade)" stroke-width="0.9" fill="none">
    <line x1="390" y1="330" x2="810" y2="330"/>
    <line x1="310" y1="360" x2="890" y2="360"/>
    <line x1="230" y1="390" x2="970" y2="390"/>
    <line x1="600" y1="300" x2="600" y2="420"/>
    <line x1="540" y1="300" x2="360" y2="420"/>
    <line x1="660" y1="300" x2="840" y2="420"/>
    <line x1="510" y1="300" x2="250" y2="420"/>
    <line x1="690" y1="300" x2="950" y2="420"/>
    <line x1="480" y1="300" x2="120" y2="420"/>
    <line x1="720" y1="300" x2="1080" y2="420"/>
  </g>

  <!-- cornice highlights -->
  <g stroke="#CFE2FF" stroke-opacity="0.28" stroke-width="1" fill="none">
    <line x1="470" y1="140" x2="730" y2="140"/>
    <line x1="470" y1="300" x2="730" y2="300"/>
  </g>

  <!-- foreground frame -->
  <g fill="none" stroke="#C6DCF7" stroke-opacity="0.26" stroke-width="1.1">
    <polyline points="150,20 1050,20 1050,420 150,420 150,20"/>
  </g>

  <!-- tonal falloff -->
  <rect width="1200" height="420" fill="url(#vignette)"/>
  <rect width="1200" height="420" filter="url(#grain)" opacity="0.05"/>

  <!-- editorial marks -->
  <g fill="#B9CCE4" opacity="0.44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3">
    <text x="56" y="54">FIG. 01</text>
    <text x="1144" y="54" text-anchor="end">PERSPECTIVE STUDY</text>
    <text x="56" y="376" font-size="12" letter-spacing="4" opacity="0.9">LIGHT / SPACE / INTERACTION</text>
    <text x="1144" y="376" text-anchor="end" font-size="10" letter-spacing="3">PRODUCT ENGINEERING</text>
  </g>

  <g stroke="#A9C3E0" stroke-opacity="0.15" fill="none">
    <rect x="24" y="24" width="1152" height="372"/>
    <line x1="24" y1="40" x2="40" y2="24"/>
    <line x1="1176" y1="40" x2="1160" y2="24"/>
    <line x1="24" y1="380" x2="40" y2="396"/>
    <line x1="1176" y1="380" x2="1160" y2="396"/>
  </g>
</svg>
